<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- faint grid dots -->
  <g opacity="0.08">
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff"/>
    </pattern>
    <rect width="1000" height="260" fill="url(#dots)"/>
  </g>

  <!-- drifting accent orb -->
  <circle cx="880" cy="70" r="120" fill="#58a6ff" opacity="0.08">
    <animate attributeName="cx" values="880;930;880" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="190" r="90" fill="#bc8cff" opacity="0.08">
    <animate attributeName="cy" values="190;150;190" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="60" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f0f3f8">
    Tejas Malhotra
  </text>

  <!-- animated underline accent -->
  <rect x="62" y="134" width="0" height="5" rx="2.5" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="width" values="0;420;420" keyTimes="0;0.6;1" dur="2.2s" fill="freeze"/>
  </rect>

  <!-- role line -->
  <text x="60" y="178" font-family="'Fira Code', 'Consolas', monospace" font-size="21" fill="#9aa5b1">
    Software Engineer
    <tspan fill="#58a6ff"> · </tspan>
    <tspan fill="#c3cad4">backend, full-stack, AI/MCP</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="214" font-family="'Fira Code', 'Consolas', monospace" font-size="15" fill="#6b7280">
    building things that get tested before they ship, not after.
  </text>

  <!-- corner bracket accents -->
  <g stroke="#58a6ff" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M 920 36 L 944 36 L 944 60"/>
    <path d="M 944 200 L 944 224 L 920 224"/>
  </g>
</svg>
