<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="40%" stop-color="#0d1226"/>
      <stop offset="75%" stop-color="#191235"/>
      <stop offset="100%" stop-color="#241440"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#glowA)" transform="translate(620,-40)"/>
  <rect width="700" height="420" fill="url(#glowB)" transform="translate(560,40)"/>

  <!-- network / circuit motif, right two-thirds -->
  <g opacity="0.55">
    <g stroke="#4d5a76" stroke-width="1.1" fill="none" opacity="0.5">
      <path d="M 560 60 L 660 95 L 760 55 L 870 90"/>
      <path d="M 660 95 L 700 175 L 820 190"/>
      <path d="M 760 55 L 820 190"/>
      <path d="M 870 90 L 930 150 L 820 190"/>
      <path d="M 560 60 L 620 190 L 700 175"/>
      <path d="M 930 150 L 950 60"/>
    </g>

    <!-- travelling pulses along two edges -->
    <path id="pulsePath1" d="M 560 60 L 660 95 L 760 55 L 870 90" fill="none" stroke="none"/>
    <circle r="3.2" fill="#58a6ff" filter="url(#glow)">
      <animateMotion dur="4.5s" repeatCount="indefinite">
        <mpath href="#pulsePath1"/>
      </animateMotion>
    </circle>
    <path id="pulsePath2" d="M 620 190 L 700 175 L 820 190 L 930 150" fill="none" stroke="none"/>
    <circle r="3.2" fill="#bc8cff" filter="url(#glow)">
      <animateMotion dur="5.5s" repeatCount="indefinite" begin="0.8s">
        <mpath href="#pulsePath2"/>
      </animateMotion>
    </circle>

    <!-- nodes -->
    <g fill="#9fb4d8">
      <circle cx="560" cy="60" r="3.5"/>
      <circle cx="660" cy="95" r="3.5"/>
      <circle cx="760" cy="55" r="4.5"/>
      <circle cx="870" cy="90" r="3.5"/>
      <circle cx="700" cy="175" r="3.5"/>
      <circle cx="820" cy="190" r="4.5"/>
      <circle cx="930" cy="150" r="3.5"/>
      <circle cx="620" cy="190" r="3"/>
      <circle cx="950" cy="60" r="3"/>
    </g>
  </g>

  <!-- faint grid dots on left, subtle texture only -->
  <g opacity="0.06">
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff"/>
    </pattern>
    <rect width="420" height="260" fill="url(#dots)"/>
  </g>

  <!-- name -->
  <text x="60" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f3f6fb">
    Tejas Malhotra
  </text>

  <!-- animated underline accent -->
  <rect x="62" y="134" width="0" height="5" rx="2.5" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="width" values="0;420;420" keyTimes="0;0.6;1" dur="2.2s" fill="freeze"/>
  </rect>

  <!-- role line -->
  <text x="60" y="178" font-family="'Fira Code', 'Consolas', monospace" font-size="21" fill="#9aa5b1">
    Software Engineer
    <tspan fill="#58a6ff"> · </tspan>
    <tspan fill="#c3cad4">backend, full-stack, AI/MCP</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="214" font-family="'Fira Code', 'Consolas', monospace" font-size="15" fill="#75829a">
    building things that get tested before they ship, not after.
  </text>
</svg>
