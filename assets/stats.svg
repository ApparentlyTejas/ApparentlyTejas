<svg width="1000" height="210" viewBox="0 0 1000 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="45%" stop-color="#0d1226"/>
      <stop offset="100%" stop-color="#1f1138"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="pulseglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#2a3148" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1000" height="210" rx="14" fill="url(#bg2)"/>
  <rect width="1000" height="210" rx="14" fill="url(#grid)" opacity="0.4"/>
  <rect width="1000" height="210" rx="14" fill="url(#pulseglow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <rect x="14" y="0" width="972" height="3" rx="1.5" fill="url(#accent2)" filter="url(#glow2)"/>

  <!-- header label -->
  <text x="30" y="34" font-family="'Fira Code', Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#6b7a99">GITHUB ACTIVITY</text>
  <circle cx="155" cy="30" r="3" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#3a4360" stroke-width="1" stroke-dasharray="130" stroke-dashoffset="130">
    <line x1="250" y1="46" x2="250" y2="176"><animate attributeName="stroke-dashoffset" from="130" to="0" dur="0.9s" begin="0.1s" fill="freeze"/></line>
    <line x1="500" y1="46" x2="500" y2="176"><animate attributeName="stroke-dashoffset" from="130" to="0" dur="0.9s" begin="0.25s" fill="freeze"/></line>
    <line x1="750" y1="46" x2="750" y2="176"><animate attributeName="stroke-dashoffset" from="130" to="0" dur="0.9s" begin="0.4s" fill="freeze"/></line>
  </g>

  <!-- stat 1: contributions last year, with real 14-week sparkline -->
  <g transform="translate(125, 100)" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="125,120" to="125,100" dur="0.6s" begin="0.15s" fill="freeze"/>
    <g transform="translate(-10,-62)" fill="none" stroke="#f78166" stroke-width="1.6">
      <path d="M 0 0 C 0 0 1.5 4.3 1.5 7.1 C 1.5 9.7 -0.3 11.9 -2.9 11.9 C -5.5 11.9 -7.3 9.7 -7.3 7.1 L -7.3 6.6 C -9.8 9.7 -11.3 13.8 -11.3 18.2 C -11.3 23.9 -6.6 28.6 -0.9 28.6 C 4.8 28.6 9.5 23.9 9.5 18.2 C 9.5 11.6 6.2 5.6 0 0 Z"/>
    </g>
    <text y="-14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f3f6fb">362</text>
    <text y="12" font-family="'Fira Code', Consolas, monospace" font-size="12" fill="#8b97ad">contributions / last yr</text>
    <!-- real sparkline, last 14 weeks -->
    <g transform="translate(-63, 26)">
      <rect x="0"  y="19" width="7" height="1"  fill="#3a4360"/>
      <rect x="9"  y="19" width="7" height="1"  fill="#3a4360"/>
      <rect x="18" y="17" width="7" height="3"  fill="#58a6ff"/>
      <rect x="27" y="16" width="7" height="4"  fill="#58a6ff"/>
      <rect x="36" y="18" width="7" height="2"  fill="#58a6ff"/>
      <rect x="45" y="11" width="7" height="9"  fill="#bc8cff"/>
      <rect x="54" y="19" width="7" height="1"  fill="#3a4360"/>
      <rect x="63" y="19" width="7" height="1"  fill="#3a4360"/>
      <rect x="72" y="19" width="7" height="1"  fill="#3a4360"/>
      <rect x="81" y="19" width="7" height="1"  fill="#3a4360"/>
      <rect x="90" y="19" width="7" height="1"  fill="#3a4360"/>
      <rect x="99" y="19" width="7" height="1"  fill="#3a4360"/>
      <rect x="108" y="10" width="7" height="10" fill="#bc8cff"/>
      <rect x="117" y="0" width="7" height="20" fill="#58a6ff"/>
    </g>
  </g>

  <!-- stat 2: total commits -->
  <g transform="translate(375, 100)" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="375,120" to="375,100" dur="0.6s" begin="0.3s" fill="freeze"/>
    <g transform="translate(-8,-70)" fill="none" stroke="#58a6ff" stroke-width="1.6">
      <circle cx="0" cy="8" r="3.4"/>
      <line x1="0" y1="0" x2="0" y2="4.4"/>
      <line x1="0" y1="11.6" x2="0" y2="16"/>
    </g>
    <text y="-14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f3f6fb">508</text>
    <text y="12" font-family="'Fira Code', Consolas, monospace" font-size="12" fill="#8b97ad">total contributions</text>
  </g>

  <!-- stat 3: stars earned -->
  <g transform="translate(625, 100)" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="625,120" to="625,100" dur="0.6s" begin="0.45s" fill="freeze"/>
    <path transform="translate(-8,-72)" fill="#f0c349" d="M8 0 L10.4 5.3 L16 6.1 L12 10.2 L13 15.8 L8 13 L3 15.8 L4 10.2 L0 6.1 L5.6 5.3 Z"/>
    <text y="-14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f3f6fb">50</text>
    <text y="12" font-family="'Fira Code', Consolas, monospace" font-size="12" fill="#8b97ad">stars earned</text>
  </g>

  <!-- stat 4: repos -->
  <g transform="translate(875, 100)" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="875,120" to="875,100" dur="0.6s" begin="0.6s" fill="freeze"/>
    <g transform="translate(-9,-74)" fill="none" stroke="#bf91f3" stroke-width="1.6">
      <rect x="0" y="2" width="14" height="11" rx="1.5"/>
      <path d="M 0 5 L 14 5"/>
      <path d="M 4 2 L 4 0 L 10 0 L 10 2"/>
    </g>
    <text y="-14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f3f6fb">32</text>
    <text y="12" font-family="'Fira Code', Consolas, monospace" font-size="12" fill="#8b97ad">repositories</text>
  </g>
</svg>
